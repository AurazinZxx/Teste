
name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:

jobs:
  deploy-rdp:
    runs-on: windows-latest

    steps:
      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

      - name: Fast Tailscale & IP
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $installer = Join-Path $env:TEMP 'ts.msi'
          curl.exe -sSL 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi' -o $installer
          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn /norestart" -Wait
          & 'C:\Program Files\Tailscale\tailscale.exe' up --authkey="$env:TAILSCALE_AUTH_KEY" --hostname="enigmano-$env:GITHUB_RUN_ID"
          $tsIP = & 'C:\Program Files\Tailscale\tailscale.exe' ip -4
          Write-Host "Tailscale IP: $tsIP"

      - name: Keep Alive
        shell: pwsh
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
          
