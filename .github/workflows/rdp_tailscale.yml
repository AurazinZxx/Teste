name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:

jobs:
  deploy-rdp:
    runs-on: windows-latest

    steps:
      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

      - name: Fast Tailscale & IP
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $msiPath = "$env:TEMP\ts.msi"
          curl.exe -fSsL 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi' -o $msiPath

          if ($LASTEXITCODE -ne 0) {
            throw 'Falha ao baixar o instalador do Tailscale.'
          }

          $arguments = "/i `"$msiPath`" /qn /norestart TS_UNATTENDEDMODE=always TS_NOLAUNCH=true"
          Start-Process msiexec.exe -ArgumentList $arguments -Wait

          Start-Service Tailscale -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          $tailscale = 'C:\Program Files\Tailscale\tailscale.exe'
          & $tailscale up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=enigm ano-$env:GITHUB_RUN_ID".Replace(' ', '') --unattended

          if ($LASTEXITCODE -ne 0) {
            throw 'Falha ao conectar o Tailscale.'
          }

          $tsIP = & $tailscale ip -4
          Write-Host "Tailscale IP: $tsIP"
          Write-Host "::notice title=TAILSCALE_IP::$tsIP"

      - name: Keep Alive
        shell: pwsh
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
          
