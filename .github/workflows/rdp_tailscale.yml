name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:

jobs:
  deploy-rdp:
    runs-on: windows-latest
    steps:
      - name: Enable RDP & Setup User
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # Cria apenas o usuario Admin para conexao RDP
          net user Admin "P@ssw0rd1234!" /add
          net localgroup Administrators Admin /add

      - name: Fast Tailscale & IP
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $msiPath = "$env:TEMP\ts.msi"
          curl.exe -sSL "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -o $msiPath
          Start-Process msiexec.exe -ArgumentList "/i `"$msiPath`" /qn /norestart TS_UNATTENDEDMODE=always TS_NOLAUNCH=true" -Wait
          
          Start-Service Tailscale -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey "$env:TAILSCALE_AUTH_KEY" --hostname "enigmano-$env:GITHUB_RUN_ID" --unattended
          
          $tsIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "Tailscale IP: $tsIP"
          Write-Host "::notice title=TAILSCALE_IP::$tsIP"

      - name: Keep Alive
        run: |
          while ($true) { Start-Sleep -Seconds 60 }
          
